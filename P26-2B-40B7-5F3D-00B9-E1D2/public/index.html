<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diário de Bordo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topo">
    <h1>Diário de Bordo</h1>
    <div id="usuario"></div>
  </header>

  <main>
    <section id="login" class="cartao" hidden>
      <p>Entre com o Discord para abrir o seu diário. Só você vê as suas entradas.</p>
      <a class="btn" href="/api/auth/discord">Entrar com Discord</a>
    </section>

    <section id="app" hidden>
      <form id="form-entrada" class="cartao">
        <h2>Nova entrada</h2>
        <label for="texto">O que aconteceu hoje no projeto?</label>
        <textarea id="texto" maxlength="2000" rows="3" required></textarea>
        <label for="impedimento">Nível de impedimento técnico</label>
        <select id="impedimento">
          <option value="nenhum">Sem impedimento</option>
          <option value="baixo">Baixo</option>
          <option value="medio">Médio</option>
          <option value="critico">Crítico</option>
        </select>
        <button class="btn" type="submit">Registrar</button>
        <p id="msg" role="status"></p>
      </form>

      <form id="form-busca" class="cartao">
        <h2>Buscar</h2>
        <input id="q" type="search" placeholder="Palavra-chave" aria-label="Palavra-chave">
        <label for="de">De</label><input id="de" type="date">
        <label for="ate">Até</label><input id="ate" type="date">
        <button class="btn" type="submit">Buscar</button>
      </form>

      <ol id="linha" class="linha"></ol>
    </section>
  </main>

  <footer>
    Chave Única de Auditoria: <code>P26-2B-40B7-5F3D-00B9-E1D2</code> · Turma 2B · Licenciado sob MIT
  </footer>
  <script src="app.js"></script>
</body>
</html>
